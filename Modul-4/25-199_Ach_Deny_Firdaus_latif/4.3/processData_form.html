<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 13px;
            margin: 20px 40px;
        }

        h2 {
            font-size: 26px;
        }

        fieldset {
            width: 480px;
            padding: 15px;
            background-color: #ccccff;
            border: 1px solid #666;
        }

        legend {
            font-weight: bold;
            font-size: 14px;
        }

        .field {
            margin-bottom: 6px;
        }

        .field label {
            display: inline-block;
            width: 130px;
            text-align: right;
            margin-right: 8px;
            vertical-align: top;
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"],
        .field textarea {
            width: 230px;
        }

        .field textarea {
            resize: none;
        }

        .buttons {
            margin-left: 142px;
        }
    </style>
</head>
<body>
    <h2>Register</h2>
   <fieldset>
    <legend>Person Details</legend>
<form name="myForm" action="processData.php" method="POST">
    <div class="field">
        <label for="surname">Surname :</label>
        <input type="text" name="surname" size="31"/>
    </div>
    <div class="field">
        <label for="email">Email :</label>
        <input type="text" name="email" size="31"/>
    </div>
    <div class="field">
        <label for="passwd">Password :</label>
        <input type="password" name="passwd" size="31"/>
    </div>
    <div class="field">
        <label for="address">Street Address :</label>
        <textarea name="address" rows="3" cols="22"></textarea>
    </div>
    <div class="field">
        <label for="state">State :</label>
        <select name="state">
            <option value="-1" selected>[Choose your state]</option>
            <option value="1">Australian Capital Territory</option>
            <option value="2">Queensland</option>
            <option value="3">Victoria</option>
            <option value="4">New South Wales</option>
            <option value="5">Tasmania</option>
            <option value="6">South Australia</option>
            <option value="7">Western Australia</option>
            <option value="8">Northern Territory</option>
        </select>
    </div>
    <div class="field">
        <input type="hidden" name="country" value="Australia">
    </div>
    <div class="field">
        <label for="sex">Gender</label>
        <input type="radio" name="sex" value="male"/>Male
        <input type="radio" name="sex" value="female"/>Female
    </div>
    <div class="field">
        <label for="vegetarian">Vegetarian?</label>
        <input type="checkbox" name="vegetarian" />
    </div>
    <div class="field">
        <label>&nbsp;</label>
        <input type="submit" value="Submit" name="submit" /><input type="reset" value="Reset" name="reset" />
    </div>
</form>
</fieldset>

</body>
</html>
