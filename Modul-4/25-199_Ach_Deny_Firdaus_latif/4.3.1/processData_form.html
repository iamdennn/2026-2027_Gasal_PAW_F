<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <style>
        body {
            font-family: Verdana, Geneva, sans-serif;
            font-size: 13px;
            margin: 20px 40px;
        }

        h2 {
            font-size: 26px;
        }

        fieldset {
            width: 480px;
            padding: 15px;
            background-color: #ccccff;
            border: 1px solid #666;
        }

        legend {
            font-weight: bold;
            font-size: 14px;
        }

        .field {
            margin-bottom: 6px;
        }

        .field label {
            display: inline-block;
            width: 130px;
            text-align: right;
            margin-right: 8px;
            vertical-align: top;
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"],
        .field textarea {
            width: 230px;
        }

        .field textarea {
            resize: none;
        }

        .buttons {
            margin-left: 142px;
        }
    </style>
</head>
<body>
    <h2>Register</h2>
    <fieldset>
        <legend>Person Details</legend>
        <form name="myForm" action="processData.php" method="post">

            <div class="field">
                <label for="surname">Surname :</label>
                <input type="text" id="surname" name="surname">
            </div>

            <div class="field">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="field">
                <label for="passwd">Password :</label>
                <input type="password" id="passwd" name="passwd">
            </div>

            <div class="field">
                <label for="address">Alamat :</label>
                <textarea id="address" name="address" rows="3" cols="22"></textarea>
            </div>

            <div class="field">
                <label for="prodi">Program Studi :</label>
                <select id="prodi" name="prodi">
                    <option value="-1" selected>[pilih program studi]</option>
                    <option value="1">Informatika</option>
                    <option value="2">Sistem Informasi</option>
                    <option value="3">Teknik Elektro</option>
                    <option value="4">Mekatronika</option>
                </select>
            </div>

            <div class="field">
                <input type="hidden" name="kampus" value="UTM">
            </div>

            <div class="field">
                <label>Sesi :</label>
                <input type="radio" id="pagi" name="sesi" value="pagi">
                <label for="pagi" style="width:auto; text-align:left; margin:0 8px 0 0;">Pagi</label>
                <input type="radio" id="siang" name="sesi" value="siang">
                <label for="siang" style="width:auto; text-align:left; margin:0;">Siang</label>
            </div>

            <div class="field">
                <label for="laptop">Bawa laptop?</label>
                <input type="checkbox" id="laptop" name="laptop">
            </div>

            <div class="field buttons">
                <input type="submit" value="Submit" name="submit">
                <input type="reset" value="Reset" name="reset">
            </div>

        </form>
    </fieldset>
</body>
</html>
